name: Release

# Push a tag like v0.1.0 (matching versionName in app/build.gradle.kts) and this builds a
# signed release APK and a debug APK and attaches both, with checksums, to a GitHub Release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BUTLER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The BUTLER_KEYSTORE_BASE64 secret isn't set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/butler-release.jks"
          echo "BUTLER_KEYSTORE_PATH=$RUNNER_TEMP/butler-release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          BUTLER_KEYSTORE_PASSWORD: ${{ secrets.BUTLER_KEYSTORE_PASSWORD }}
          BUTLER_KEY_ALIAS: ${{ secrets.BUTLER_KEY_ALIAS }}
          BUTLER_KEY_PASSWORD: ${{ secrets.BUTLER_KEY_PASSWORD }}
          BUTLER_SIGN_DEBUG: "true"
        run: ./gradlew --no-configuration-cache :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug

      - name: Name and checksum the APKs
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Butler-$VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Butler-$VERSION-debug.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Verify the release APK is signed with the release key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$apksigner" verify --print-certs "dist/Butler-$VERSION.apk" | grep -i "certificate DN"

      - uses: softprops/action-gh-release@v2
        with:
          name: Butler ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/Butler-${{ env.VERSION }}.apk
            dist/Butler-${{ env.VERSION }}-debug.apk
            dist/SHA256SUMS.txt
